<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Vitalis · guias{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#6b7280; --line:#e5e7eb;
          --bloq:#c62828; --pend:#ef6c00; --corr:#1565c0; --aten:#8d6e63; --ok:#2e7d32; }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg) }
  header { background:#111827; color:#fff; padding:14px 20px; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap }
  header a { color:#cbd5e1; text-decoration:none; padding:2px 0; border-bottom:2px solid transparent }
  header a:hover { color:#fff } header a.ativo { color:#fff; border-bottom-color:#60a5fa } header b { font-size:17px }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px }
  h2 { font-size:16px; margin:26px 0 10px; color:#374151 }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px }
  .kpi small { color:var(--muted); display:block; font-size:12px; text-transform:uppercase; letter-spacing:.03em }
  .kpi b { font-size:26px; font-weight:650; display:block; line-height:1.2; margin:2px 0 }
  .kpi.risco b { color:var(--bloq) }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; background:#fafafa }
  tr:last-child td { border-bottom:0 }
  td.num, th.num { text-align:right; white-space:nowrap }
  .tag { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; color:#fff }
  .tag.bloqueada, .tag.bloqueia { background:var(--bloq) } .tag.pendente { background:var(--pend) }
  .tag.corrigir { background:var(--corr) } .tag.atencao { background:var(--aten) } .tag.ok { background:var(--ok) }
  .barra { height:8px; background:#e5e7eb; border-radius:4px; overflow:hidden; min-width:120px }
  .barra i { display:block; height:100%; background:var(--bloq) }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px } @media (max-width:800px){ .grid2 { grid-template-columns:1fr } }
  .acao { color:#374151 } .msg { color:var(--muted); font-size:13px }
  form.filtro { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0 0 }
  input[type=date] { padding:6px 8px; border:1px solid var(--line); border-radius:6px }
  button { padding:7px 12px; border:0; border-radius:6px; background:#111827; color:#fff; cursor:pointer }
  a.id { font-family:ui-monospace,Menlo,monospace; font-size:13px; text-decoration:none; color:#1d4ed8 }
  .vazio { background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:24px; text-align:center; color:var(--muted) }
  dl { display:grid; grid-template-columns:200px 1fr; gap:6px 12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:0 }
  dt { color:var(--muted); font-size:13px } dd { margin:0 }
  .intro { color:#4b5563; margin:4px 0 0; max-width:760px }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px }
  .card h3 { margin:0 0 12px; font-size:17px }
  .fatos { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px }
  .fato { background:#f9fafb; border-radius:8px; padding:8px 10px }
  .fato small { color:var(--muted); font-size:12px; display:block } .fato b { font-size:18px }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 10px }
  .chip { background:#eef2ff; color:#3730a3; border-radius:99px; padding:2px 9px; font-size:12px }
  .chip.nao { background:#fef2f2; color:#991b1b } .chip.sim { background:#ecfdf5; color:#065f46 }
  .nota { background:#fffbeb; border-left:3px solid #f59e0b; padding:8px 10px; border-radius:6px; font-size:13px; color:#78350f }
  td.c, th.c { text-align:center }
  .rolagem { overflow-x:auto; border-radius:10px } .rolagem table { min-width:640px }
  .sim-i { color:var(--ok); font-weight:700 } .nao-i { color:#d1d5db }
  .rotulo { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em }
  .metodo { display:inline-block; min-width:62px; text-align:center; font:600 12px ui-monospace,Menlo,monospace; border-radius:6px; padding:3px 6px; color:#fff }
  .metodo.get { background:#2563eb } .metodo.post { background:#059669 } .metodo.delete { background:#dc2626 }
  code, pre { font-family:ui-monospace,Menlo,monospace; font-size:13px }
  code { background:#f3f4f6; padding:1px 5px; border-radius:4px }
  pre { background:#0f172a; color:#e2e8f0; padding:14px; border-radius:10px; overflow-x:auto; margin:0; line-height:1.5 }
  .chave { display:inline-block; background:#fef3c7; color:#92400e; border-radius:6px; padding:1px 7px; font-size:12px }
  .aberto { display:inline-block; background:#e5e7eb; color:#374151; border-radius:6px; padding:1px 7px; font-size:12px }
  .bolha { background:#fff; border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:12px 14px; white-space:pre-wrap; font-size:14px; box-shadow:0 1px 2px rgba(0,0,0,.04) }
  .chat { background:#dbeafe; border-radius:12px; padding:14px }
  .chat .de { font-size:12px; color:#1e3a8a; margin-bottom:6px; font-weight:600 }
  a.bruto { font-size:13px; color:#1d4ed8 }
  .fluxo { display:flex; flex-wrap:wrap; align-items:center; gap:8px }
  .fluxo span.passo { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:14px }
  .fluxo span.seta { color:var(--muted) }
</style>
</head>
<body>
<header><b>Vitalis · conferência de guias</b>
  <a href="/" class="{{ 'ativo' if aba == 'painel' }}">Painel</a>
  <a href="/convenios" class="{{ 'ativo' if aba == 'regras' }}">Regras dos convênios</a>
  <a href="/integracao" class="{{ 'ativo' if aba == 'integracao' }}">Integração</a></header>
<main>{% block corpo %}{% endblock %}</main>
</body>
</html>
